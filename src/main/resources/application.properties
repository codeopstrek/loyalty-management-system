# =========================
# Application
# =========================
spring.application.name=loyalty-program
server.port=8081


# =========================
# Datasource - MySQL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/loyalty
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update

# Turn OFF SQL logging and formatting
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# =========================
# Logging levels
# =========================
logging.level.root=INFO
# Optional: Ensure Hibernate SQL category stays quiet at WARN level
logging.level.org.hibernate.SQL=WARN

# ===================================================================
# Service & Instance-Wise Dynamic File Logging
# ===================================================================
# Directory outside the application root, in the shared elk-resource folder
logging.file.path=../elk-resource/logs
# Dynamically name log files per service & container/instance ID
# Example output: loyalty-program-loyalty-inst-1.log
logging.file.name=../elk-resource/logs/${spring.application.name}-${HOSTNAME:localhost}.log

# ===================================================================
# Log Rotation & Retention Settings (Rolling File Appender)
# ===================================================================
# Max size per single log file before rotating
logging.logback.rollingpolicy.max-file-size=10MB
# Maximum total cap across all archived log files
logging.logback.rollingpolicy.total-size-cap=1GB
# Keep archived logs for 30 days
logging.logback.rollingpolicy.max-history=30

# Structured Logstash JSON formatting for file logs (Spring Boot 3.4+)
logging.structured.format.file=logstash

# =================================================================== # Console Logging Pattern (with MDC request tracing) # ==============================================
 logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:-} \u2014 [%15.15t] [requestId: %X{requestId}] [txnType: %X{transactionType}] %-40.40logger{36} : %m %kvp%n